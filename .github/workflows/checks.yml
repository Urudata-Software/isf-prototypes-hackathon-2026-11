name: checks

on:
  push:
    branches: [main]
  pull_request:

# Two independent jobs, running exactly the commands documented in STACK.md.
# If these drift from that list, the list is the one that is wrong.
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # working-directory applies to `run:` steps only; actions resolve from the repo root.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: pnpm 11 fails on Node 20 with ERR_UNKNOWN_BUILTIN_MODULE.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - run: uv sync --frozen

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run pytest
