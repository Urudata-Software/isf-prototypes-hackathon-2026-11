<style>
:root{
  --bg:#f3f6fa; --surface:#fff; --ink:#0e1c2f; --ink2:#33445c; --muted:#5f6f86; --line:#dbe3ee; --line2:#edf1f6;
  --primary:#1b5ea6; --primary-600:#144c88; --primary-soft:#e7f0fa; --primary-line:#bcd3ee;
  --ok:#17784c; --ok-bg:#e4f5eb; --ok-line:#a6dabd; --ok-dot:#22a565;
  --warn:#9a5a00; --warn-bg:#fff3d9; --warn-line:#f1c56f; --warn-dot:#f0a400;
  --bad:#c4232b; --bad-bg:#fdeced; --bad-line:#f2aeb2; --bad-dot:#e0353d;
  --radius:14px; --shadow:0 1px 2px rgba(14,28,47,.06),0 6px 18px rgba(14,28,47,.05);
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:var(--primary);text-decoration:none}
button{font:inherit;cursor:pointer}
.ic{flex:none;vertical-align:middle}

/* Topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0f2c4f;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.topbar-in{max-width:1360px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:#fff}
.brand-mark{width:52px;height:52px;border-radius:12px;background:#e7f0fa;display:grid;place-items:center;overflow:hidden}
.brand-mark img{width:50px;height:50px;display:block}
.brand small{display:block;font-size:.68rem;font-weight:500;color:#a9c3e3;letter-spacing:0;white-space:nowrap}
.nav{display:flex;gap:4px;flex:1}
.nav a{color:#c9daef;padding:9px 14px;border-radius:9px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:.95rem}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:rgba(255,255,255,.14);color:#fff}
.top-right{display:flex;align-items:center;gap:14px}
.today{color:#a9c3e3;font-size:.85rem;white-space:nowrap}
.profile{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:4px 6px 4px 12px}
.profile span{font-size:.78rem;color:#a9c3e3}
.profile select{background:#fff;color:var(--ink);border:0;border-radius:7px;padding:6px 8px;font:inherit;font-weight:600;font-size:.9rem}
.bell{position:relative;background:rgba(255,255,255,.1);border:0;color:#fff;width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.bell:hover{background:rgba(255,255,255,.18)}
.bell .count{position:absolute;top:-4px;right:-4px;background:var(--bad-dot);color:#fff;font-size:.7rem;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

/* Layout */
main{max-width:1360px;margin:0 auto;padding:28px 28px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{font-size:1.85rem;margin:0;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1.15rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g-dash{grid-template-columns:1.05fr 1.6fr;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 0}
.card-b{padding:18px 22px 22px}
.mt{margin-top:18px}
.muted{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:10px}
.back:hover{color:var(--primary)}

/* KPI */
.kpi{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.kpi-top{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;font-size:.92rem}
.kpi-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.kpi-ic.bad{background:var(--bad-bg);color:var(--bad)} .kpi-ic.warn{background:var(--warn-bg);color:var(--warn)} .kpi-ic.ok{background:var(--ok-bg);color:var(--ok)}
.kpi-v{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi-s{color:var(--muted);font-size:.9rem}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:700;white-space:nowrap;border:1px solid transparent;transition:background .5s,color .5s,border-color .5s}
.b-planta{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line)}
.b-transito{background:#eef0fb;color:#3b4aa8;border-color:#c9cff2}
.b-comercios{background:#eef4f7;color:#2d5568;border-color:#c8dbe5}
.b-bloqueado{background:var(--bad);color:#fff;border-color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.b-muted{background:var(--line2);color:var(--ink2);border-color:var(--line)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok-dot)} .dot.warn{background:var(--warn-dot)} .dot.bad{background:var(--bad-dot)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{background:var(--line2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-600)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 14px rgba(196,35,43,.25)}
.btn-danger:hover{background:#a81c23}
.btn-lg{padding:14px 22px;font-size:1.05rem}
.btn[disabled]{opacity:.65;cursor:default}
.btn-link{background:none;border:0;color:var(--primary);font-weight:700;padding:0;display:inline-flex;align-items:center;gap:4px}

/* Alerts list */
.alerts{display:flex;flex-direction:column;gap:12px}
.alert{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;background:#fff;cursor:pointer;transition:background .5s,border-color .5s}
.alert:hover{background:#fafcfe}
.alert .a-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert.critica{border-color:var(--bad-line);border-left-color:var(--bad);background:var(--bad-bg);padding:18px}
.alert.critica .a-ic{background:var(--bad);color:#fff}
.alert.alta{border-left-color:var(--warn-dot)} .alert.alta .a-ic{background:var(--warn-bg);color:var(--warn)}
.alert.media{border-left-color:var(--warn-line)} .alert.media .a-ic{background:var(--warn-bg);color:var(--warn)}
.alert.info{border-left-color:var(--primary-line)} .alert.info .a-ic{background:var(--primary-soft);color:var(--primary)}
.alert.gestionada{background:#fff;border-color:var(--bad-line);border-left-color:var(--bad)}
.a-title{font-weight:700}
.alert.critica .a-title{font-size:1.1rem;color:var(--bad)}
.a-text{color:var(--ink2);font-size:.92rem;margin-top:2px}
.a-meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}

/* Tables */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;min-width:260px;color:var(--muted)}
.search input{border:0;outline:0;font:inherit;padding:10px 0;flex:1;color:var(--ink);background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:background .5s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f6f9fd}
tbody tr.row-blocked{background:var(--bad-bg)}
tbody tr.row-blocked:hover{background:#fbe1e3}
tbody tr:last-child td{border-bottom:0}
.lot-id{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Lot detail */
.lot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px 26px;transition:background .6s,border-color .6s}
.lot-head h1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lot-head.is-blocked{background:var(--bad-bg);border-color:var(--bad-line)}
.lot-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.callout{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:16px 20px;margin-top:18px}
.callout.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:#7d1117}
.callout.bad .c-ic{background:var(--bad);color:#fff}
.callout .c-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.callout b{font-size:1.05rem}
.just-blocked{animation:blockIn 1.1s ease}
@keyframes blockIn{0%{box-shadow:0 0 0 0 rgba(196,35,43,.45)}40%{box-shadow:0 0 0 10px rgba(196,35,43,.12)}100%{box-shadow:var(--shadow)}}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:26px 18px 22px}
.step{position:relative;text-align:center;padding:0 10px}
.step::before{content:"";position:absolute;top:26px;left:calc(-50% + 30px);right:calc(50% + 30px);height:3px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.current::before,.step.incident::before{background:var(--primary)}
.step-ic{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--line2);color:var(--muted);border:3px solid var(--line);position:relative;z-index:1}
.step.done .step-ic{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.step.current .step-ic{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 6px var(--primary-soft)}
.step.incident .step-ic{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 0 0 6px var(--bad-bg)}
.step-t{font-weight:800}
.step-p{color:var(--ink2);font-size:.9rem}
.step-w{color:var(--muted);font-size:.84rem;margin-top:2px}
.step.pending .step-t,.step.pending .step-p{color:var(--muted)}
.step-flag{display:inline-block;margin-top:6px}

/* Chart */
.chart-wrap{position:relative}
svg.chart{width:100%;height:auto;display:block}
.cs-band{fill:#f7f9fc} .cs-band.alt{fill:#eef3f9}
.cs-sep{stroke:#c3d0e0;stroke-dasharray:4 4}
.cs-stage{font-size:13px;font-weight:700;fill:var(--ink2)}
.cs-range{fill:rgba(34,165,101,.11)}
.cs-rline{stroke:rgba(23,120,76,.45);stroke-width:1.2;stroke-dasharray:6 5}
.cs-rlabel{font-size:12.5px;font-weight:700;fill:var(--ok)}
.cs-grid{stroke:#e6ecf3}
.cs-ylab,.cs-xlab{font-size:12.5px;fill:var(--muted)}
.cs-line{fill:none;stroke:var(--primary);stroke-width:2.6;stroke-linejoin:round}
.cs-line.bad{stroke:var(--bad);stroke-width:3.4}
.cs-exc{fill:rgba(224,53,61,.12)}
.cs-peak{fill:var(--bad);stroke:#fff;stroke-width:2.5}
.cs-plabel{font-size:15px;font-weight:800;fill:var(--bad)}
.cs-deliv circle{fill:#fff;stroke:var(--primary);stroke-width:2}
.cs-deliv text{font-size:11px;font-weight:800;fill:var(--primary)}
.cs-hover{stroke:#8aa0bb;stroke-width:1;opacity:0}
.cs-dot{fill:var(--primary);stroke:#fff;stroke-width:2;opacity:0}
.cs-dot.bad{fill:var(--bad)}
.cs-overlay{fill:transparent;cursor:crosshair}
#chart-tip{position:fixed;pointer-events:none;background:#0f2c4f;color:#fff;border-radius:8px;padding:7px 11px;font-size:.85rem;opacity:0;transition:opacity .1s;z-index:60;display:flex;flex-direction:column}
#chart-tip.bad{background:var(--bad)}
#chart-tip b{font-size:1.05rem}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:10px;border-radius:3px;display:inline-block}

/* Data list */
.dl{display:grid;grid-template-columns:auto 1fr;gap:12px 22px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600}
.stores{display:flex;flex-direction:column}
.store{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.store:last-child{border-bottom:0}
.store-n{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;display:grid;place-items:center;flex:none;font-size:.88rem}
.store-main{flex:1}
.store-name{font-weight:700}
.store-sub{color:var(--muted);font-size:.88rem}

/* Banner (comercio) */
.banner{display:flex;gap:16px;align-items:flex-start;background:var(--bad);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(196,35,43,.25);animation:slideIn .6s ease}
.banner .b-ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.banner h2{font-size:1.3rem}
.banner p{margin:6px 0 0;opacity:.95}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.store-pick{display:flex;align-items:center;gap:10px}
.store-pick select{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}

/* Trucks */
.truck{padding:22px}
.truck-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.truck-temp{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;margin:14px 0 2px}
.truck-temp small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:6px}
.truck .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.truck .row:last-of-type{border-bottom:0}
.truck .row span:first-child{color:var(--muted)}
.task{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:.92rem}
.task.bad{background:var(--bad-bg);color:#7d1117;border:1px solid var(--bad-line)}

/* Modal, drawer, toast */
.overlay{position:fixed;inset:0;background:rgba(12,26,45,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;gap:14px;align-items:flex-start;padding:24px 26px 6px}
.modal-h .m-ic{width:46px;height:46px;border-radius:12px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;flex:none}
.modal-b{padding:10px 26px 4px 86px;color:var(--ink2)}
.modal-b ul{margin:10px 0 0;padding-left:20px}
.modal-b li{margin:6px 0}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:20px 26px 24px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drawer-ov{position:fixed;inset:0;background:rgba(12,26,45,.35);z-index:50;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:#fff;z-index:51;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;animation:slideL .25s ease}
@keyframes slideL{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer-b{padding:20px 24px;overflow:auto;flex:1}
.icon-btn{background:var(--line2);border:0;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink2)}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.mail-h{background:#f7f9fc;padding:14px 16px;border-bottom:1px solid var(--line);font-size:.9rem}
.mail-h div{margin:3px 0}
.mail-h b{display:inline-block;min-width:64px;color:var(--muted);font-weight:600}
.mail-subj{font-weight:800;font-size:1.02rem;color:var(--ink)}
.mail-body{padding:16px;white-space:pre-wrap;font-size:.92rem;color:var(--ink2)}
.rcpt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rcpt span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem}
#toasts{position:fixed;top:84px;right:24px;z-index:70;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:12px;background:#0f2c4f;color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;animation:slideL .3s ease;font-size:1rem}
.toast .t-ic{width:30px;height:30px;border-radius:50%;background:var(--ok-dot);display:grid;place-items:center}
.reset{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:transparent;border:0;color:#9aa8bb;font-size:.78rem;display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:8px}
.reset:hover{color:var(--ink2);background:#fff}

/* Mascota quieta en la esquina que sigue el cursor con la mirada */
#mascot{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:120px;height:120px;pointer-events:none;z-index:40;filter:drop-shadow(0 8px 10px rgba(14,28,47,.22))}
#mascot .m-inner{width:100%;height:100%}
#mascot .pupil{transition:transform .08s linear}
#mascot svg{width:100%;height:100%;display:block;overflow:visible}
#mascot .arm,#mascot .m-body{transform-box:view-box}
#mascot .arm-l{transform-origin:88px 104px}
#mascot .arm-r{transform-origin:158px 104px}
#mascot .m-body{transform-origin:123px 128px}
#mascot .spark{opacity:0}

function noise(i, seed) { const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }

function buildLot(s, seed) {
  const prod = PRODUCTS[s.p];
  const expires = at(s.dte, 0, 0);
  const made = at(s.dte - prod.shelf, 5, 40);
  const empAt = new Date(+made + 210 * MIN);   // 09:10
  const camAt = new Date(+made + 260 * MIN);   // 10:00
  let loadAt = null, deliveries = [];
  if (s.loc === 'comercios') {
    loadAt = new Date(+startOf(made) + DAY + 5 * HOUR + 50 * MIN);
    deliveries = s.stores.map(([sid, units], i) => {
      let t;
      if (s.deliveries) { const [h, m] = s.deliveries[i].split(':').map(Number); t = new Date(startOf(loadAt)); t.setHours(h, m); }
      else t = new Date(+loadAt + 100 * MIN + i * 50 * MIN);
      return { store: sid, units, at: t };
    });
  } else if (s.loc === 'transito') loadAt = at(0, 6, 0);
  const units = s.units || deliveries.reduce((a, d) => a + d.units, 0);

  // Lecturas de temperatura cada 10 minutos
  const end = s.loc === 'comercios' ? deliveries[deliveries.length - 1].at : NOW;
  let from = +empAt;
  if (+end - from > 60 * HOUR) from = +empAt + Math.ceil((+end - 60 * HOUR - +empAt) / (10 * MIN)) * 10 * MIN;
  const temps = [];
  for (let t = from, i = 0; t <= +end; t += 10 * MIN, i++) {
    const n = noise(i, seed + 1);
    let v;
    if (t < +camAt) v = 5.6 - 1.2 * ((t - +empAt) / (+camAt - +empAt)) + n * 0.15;
    else if (!loadAt || t < +loadAt) v = 3.5 + n * 0.35;
    else {
      v = 4.5 + n * 0.4;
      for (const d of deliveries) { const m = (t - +d.at) / MIN; if (m >= 0 && m < 20) v += m < 10 ? 1.4 : 0.6; }
    }
    const d = new Date(t);
    if (s.override && dayDiff(d) === dayDiff(loadAt) && s.override[hhmm(d)] != null) v = s.override[hhmm(d)];
    temps.push({ t: d, v: Math.round(v * 10) / 10 });
  }

  // Desvíos fuera de 2–8 °C
  let excursion = null;
  temps.forEach((r, i) => {
    if (r.v > 8 || r.v < 2) {
      if (!excursion) excursion = { from: r.t, to: r.t, max: r.v, peakAt: r.t };
      excursion.to = r.t;
      if (r.v > excursion.max) { excursion.max = r.v; excursion.peakAt = r.t; }
    }
  });
  if (excursion) excursion.minutes = Math.round((excursion.to - excursion.from) / MIN);

  return {
    id: s.id, product: prod.name, productKey: s.p, made, expires, empAt, camAt, loadAt, deliveries, units,
    loc: s.loc, place: s.place, atPacking: !!s.atPacking, truck: s.truck || null, temps, excursion,
    status: s.loc, blockedAt: null,
  };
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, arg] = h.split('/');
  return { name: name || '', arg: arg ? decodeURIComponent(arg) : null };
}

function statusBadge(l) {
  if (l.status === 'bloqueado') return `<span class="badge b-bloqueado">${icon('lock', 14, 2.4)}Bloqueado – En retiro</span>`;
  if (l.status === 'planta') return `<span class="badge b-planta">${icon('factory', 14, 2.2)}En planta</span>`;
  if (l.status === 'transito') return `<span class="badge b-transito">${icon('truck', 14, 2.2)}En tránsito</span>`;
  return `<span class="badge b-comercios">${icon('store', 14, 2.2)}En comercios</span>`;
}
function coldBadge(l) {
  return l.excursion
    ? `<span class="badge b-bad">${icon('thermo', 14, 2.2)}Desvío ${t1(l.excursion.max)} °C</span>`
    : `<span class="badge b-ok">${icon('check', 14, 2.6)}En rango</span>`;
}
function semaforo(d) { return `<span style="display:inline-flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap"><span class="dot ${semClass(d)}"></span>${daysText(d)}</span>`; }
function whereText(l) {

function kpi(ic, cls, label, value, sub) {

}

const FILTERS = [['todos', 'Todos'], ['planta', 'En planta'], ['transito', 'En tránsito'], ['comercios', 'En comercios'], ['alerta', 'Con alerta'], ['bloqueado', 'Bloqueados']];
function filteredLots() {
  const q = S.search.trim().toLowerCase();
  const alertLots = new Set(S.alerts.filter(a => a.state === 'abierta' && a.lot).map(a => a.lot));
  return S.lots.filter(l => {
    if (q && !(l.id.toLowerCase().includes(q) || l.product.toLowerCase().includes(q))) return false;
    if (S.filter === 'todos') return true;
    if (S.filter === 'alerta') return alertLots.has(l.id) || !!l.excursion;
    return l.status === S.filter;
  }).sort((a, b) => (b.id === 'L-2411') - (a.id === 'L-2411') || (b.status === 'bloqueado') - (a.status === 'bloqueado') || a.id.localeCompare(b.id));
}
function lotRows() {
  const rows = filteredLots();
  if (!rows.length) return `<tr><td colspan="6" class="empty">No hay lotes con ese criterio.</td></tr>`;
  return rows.map(l => `<tr class="click ${l.status === 'bloqueado' ? 'row-blocked' : ''}" data-lot="${l.id}">
      <td class="lot-id">${l.id}</td><td>${l.product}</td><td class="muted">${whereText(l)}</td>
      <td class="tnum">${fmtD(l.expires)}</td><td>${coldBadge(l)}</td><td>${statusBadge(l)}</td></tr>`).join('');
}
function viewTablero() {
  const by = st => S.lots.filter(l => l.status === st).length;
  const open = S.alerts.filter(a => a.state === 'abierta');

  const recalls = S.lots.filter(l => l.status === 'bloqueado').length;
  const soon = S.lots.filter(l => daysLeft(l) <= 7);
  const soonPlant = soon.filter(l => l.loc === 'planta').length, soonStores = soon.length - soonPlant;
  const okLots = S.lots.filter(l => !l.excursion).length;
  const pct = Math.round(okLots / S.lots.length * 100);
  const alerts = [...S.alerts].sort((a, b) => (a.level === 'critica' ? -1 : 0) - (b.level === 'critica' ? -1 : 0) || (a.state === 'resuelta') - (b.state === 'resuelta'));
  return `
  <div class="page-head"><div><h1>Tablero de trazabilidad</h1><div class="sub">De la fábrica a la góndola, en tiempo real · ${PLANT}</div></div></div>
  <div class="grid g4">
    ${kpi('box', '', 'Lotes activos', S.lots.length, `${by('planta')} en planta · ${by('transito')} en tránsito · ${by('comercios')} en comercios${recalls ? ` · <b style="color:var(--bad)">${recalls} en retiro</b>` : ''}`)}
    ${kpi('alert', open.length ? 'bad' : 'ok', 'Alertas abiertas', open.length, crit ? `<b style="color:var(--bad)">${plural(crit, 'crítica', 'críticas')}</b>` : recalls ? `${plural(recalls, 'retiro', 'retiros')} en curso` : 'Sin alertas críticas')}
    ${kpi('calendar', 'warn', 'Vencen en 7 días', soon.length, `${soonPlant} en planta · ${soonStores} en comercios`)}
    ${kpi('thermo', pct === 100 ? 'ok' : 'warn', 'Cadena de frío', `${pct} %`, `${okLots} de ${S.lots.length} lotes siempre entre 2 y 8 °C`)}
  </div>
  <div class="grid g-dash mt">
    <div class="card"><div class="card-h"><h2>Alertas recientes</h2><span class="muted" style="font-size:.88rem">${plural(open.length, 'abierta', 'abiertas')}</span></div>
      <div class="card-b alerts">${alerts.map(alertCard).join('')}</div></div>
    <div class="card"><div class="card-h" style="flex-wrap:wrap"><h2>Lotes</h2>
        <label class="search">${icon('search', 18)}<input id="search" placeholder="Buscar lote o producto" value="${esc(S.search)}"></label></div>
      <div class="card-b" style="padding-bottom:6px"><div class="chips">${FILTERS.map(([k, v]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-filter="${k}">${v}</button>`).join('')}</div></div>
      <div class="table-scroll"><table><thead><tr><th>Lote</th><th>Producto</th><th>Dónde está</th><th>Vence</th><th>Cadena de frío</th><th>Estado</th></tr></thead><tbody id="lot-rows">${lotRows()}</tbody></table></div>
    </div>

function alertCard(a) {
  const managed = a.state === 'en_retiro';

/* ===================== Detalle de lote ===================== */
function lotSteps(l) {
  const T = l.truck ? TRUCKS[l.truck] : null;
  const blocked = l.status === 'bloqueado';
  const steps = [
    { ic: 'factory', t: 'Fabricación', p: PLANT, w: fmtDT(l.made), st: 'done' },
    { ic: 'box', t: 'Empaque', p: 'Línea de empaque 2', w: fmtDT(l.empAt), st: l.atPacking ? 'current' : 'done' },
    { ic: 'snow', t: 'Cámara de frío', p: l.loc === 'planta' && !l.atPacking ? l.place : 'Cámara de frío 1', w: l.atPacking ? 'Pendiente' : fmtDT(l.camAt), st: l.atPacking ? 'pending' : l.loc === 'planta' ? 'current' : 'done' },
    { ic: 'truck', t: T ? T.name : 'Transporte', p: T ? T.route : 'Sin asignar', w: l.loadAt ? `Salida ${fmtDT(l.loadAt)}` : 'Pendiente', st: l.loc === 'transito' ? 'current' : l.loc === 'comercios' ? 'done' : 'pending' },
    { ic: 'store', t: 'Comercios', p: l.deliveries.length ? plural(l.deliveries.length, 'comercio', 'comercios') : 'Sin entregar',
      w: l.deliveries.length ? `${relDay(l.deliveries[0].at)} ${hhmm(l.deliveries[0].at)}–${hhmm(l.deliveries[l.deliveries.length - 1].at)}` : l.loc === 'transito' ? 'Entrega prevista hoy' : 'Pendiente',
      st: l.loc === 'comercios' ? (blocked ? 'incident' : 'current') : 'pending' },
  ];
  if (l.excursion) { steps[3].st = 'incident'; steps[3].flag = `<span class="badge b-bad step-flag">${icon('thermo', 13, 2.4)}${t1(l.excursion.max)} °C · ${l.excursion.minutes} min</span>`; }
  if (blocked) steps[4].flag = `<span class="badge b-bloqueado step-flag">Retiro en curso</span>`;
  return `<div class="steps">${steps.map(s => `<div class="step ${s.st}"><div class="step-ic">${icon(s.ic, 22)}</div>
    <div class="step-t">${s.t}</div><div class="step-p">${s.p}</div><div class="step-w">${s.w}</div>${s.flag || ''}</div>`).join('')}</div>`;
}

const CHARTS = {};
function tempChart(l) {
  // Con camión: mostrar las 4 horas previas a la carga y el viaje, que es donde está la historia
  const s = l.loadAt ? l.temps.filter(r => +r.t >= +l.loadAt - 4 * HOUR) : l.temps;
  if (s.length < 2) return `<div class="empty">Todavía no hay lecturas: el lote está en la línea de empaque.</div>`;
  const W = 1000, H = 340, Lp = 54, Rp = 20, Tp = 40, Bp = 40;
  const t0 = +s[0].t, tN = +s[s.length - 1].t;
  const x = t => Lp + (t - t0) / (tN - t0) * (W - Lp - Rp);
  const y = v => Tp + (1 - v / 11) * (H - Tp - Bp);
  let g = '';
  // Etapas
  const stages = [];
  if (l.loadAt && +l.loadAt > t0) {
    stages.push({ label: `${PLANT} · cámara de frío`, from: t0, to: +l.loadAt });
    stages.push({ label: `${TRUCKS[l.truck].name} · ${TRUCKS[l.truck].route}`, from: +l.loadAt, to: tN });
  } else if (l.loadAt) stages.push({ label: `${TRUCKS[l.truck].name} · ${TRUCKS[l.truck].route}`, from: t0, to: tN });
  else stages.push({ label: `${PLANT} · ${l.atPacking ? 'línea de empaque' : 'cámara de frío'}`, from: t0, to: tN });
  stages.forEach((st, i) => {
    g += `<rect class="cs-band ${i % 2 ? 'alt' : ''}" x="${x(st.from)}" y="${Tp}" width="${x(st.to) - x(st.from)}" height="${H - Tp - Bp}"/>`;
    if (i) g += `<line class="cs-sep" x1="${x(st.from)}" x2="${x(st.from)}" y1="${Tp - 22}" y2="${H - Bp}"/>`;
    g += `<text class="cs-stage" x="${x(st.from) + 10}" y="${Tp - 10}">${esc(st.label)}</text>`;
  });
  // Rango permitido
  g += `<rect class="cs-range" x="${Lp}" y="${y(8)}" width="${W - Lp - Rp}" height="${y(2) - y(8)}"/>`;
  g += `<line class="cs-rline" x1="${Lp}" x2="${W - Rp}" y1="${y(8)}" y2="${y(8)}"/><line class="cs-rline" x1="${Lp}" x2="${W - Rp}" y1="${y(2)}" y2="${y(2)}"/>`;
  g += `<text class="cs-rlabel" x="${W - Rp - 8}" y="${y(2) - 8}" text-anchor="end">Rango permitido 2–8 °C</text>`;
  // Eje Y
  [0, 2, 4, 6, 8, 10].forEach(v => {
    if (v !== 2 && v !== 8) g += `<line class="cs-grid" x1="${Lp}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/>`;
    g += `<text class="cs-ylab" x="${Lp - 10}" y="${y(v) + 4}" text-anchor="end">${v} °C</text>`;
  });
  // Eje X
  const span = tN - t0;
  const step = span > 30 * HOUR ? 6 * HOUR : span > 14 * HOUR ? 3 * HOUR : HOUR;
  const firstTick = Math.ceil(t0 / step) * step;
  for (let t = firstTick; t <= tN; t += step) {
    const d = new Date(t);
    g += `<text class="cs-xlab" x="${x(t)}" y="${H - Bp + 22}" text-anchor="middle">${d.getHours() === 0 || t === firstTick ? `${relDay(d)} ` : ''}${hhmm(d)}</text>`;
  }
  // Desvío
  if (l.excursion) {
    const e = l.excursion;
    g += `<rect class="cs-exc" x="${x(+e.from) - 6}" y="${Tp}" width="${x(+e.to) - x(+e.from) + 12}" height="${H - Tp - Bp}"/>`;
  }
  // Entregas
  l.deliveries.forEach((d, i) => { if (+d.at >= t0 && +d.at <= tN) g += `<g class="cs-deliv"><circle cx="${x(+d.at)}" cy="${H - Bp - 14}" r="10"/><text x="${x(+d.at)}" y="${H - Bp - 10}" text-anchor="middle">${i + 1}</text></g>`; });
  // Línea
  const pts = s.map(p => ({ x: x(+p.t), y: y(p.v), v: p.v, t: p.t }));
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  const clip = `clip-${l.id}`;
  g += `<clipPath id="${clip}"><rect x="0" y="0" width="${W}" height="${y(8)}"/></clipPath>`;
  g += `<path class="cs-line" d="${d}"/><path class="cs-line bad" d="${d}" clip-path="url(#${clip})"/>`;
  if (l.excursion) {
    const e = l.excursion, px = x(+e.peakAt), py = y(e.max);
    const right = px > W - 260;
    g += `<circle class="cs-peak" cx="${px}" cy="${py}" r="7"/>`;
    g += `<text class="cs-plabel" x="${right ? px - 14 : px + 14}" y="${py - 6}" text-anchor="${right ? 'end' : 'start'}">Pico ${t1(e.max)} °C · ${e.minutes} min fuera de rango</text>`;
  }
  g += `<line class="cs-hover" x1="0" x2="0" y1="${Tp}" y2="${H - Bp}"/><circle class="cs-dot" r="6" cx="0" cy="0"/>`;
  g += `<rect class="cs-overlay" x="${Lp}" y="${Tp}" width="${W - Lp - Rp}" height="${H - Tp - Bp}"/>`;
  CHARTS[l.id] = pts;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" data-lot="${l.id}" role="img" aria-label="Temperatura del lote ${l.id}">${g}</svg></div>`;
}
function bindCharts() {
  const tip = document.getElementById('chart-tip');
  document.querySelectorAll('svg.chart').forEach(svg => {
    const pts = CHARTS[svg.dataset.lot]; if (!pts) return;
    const ov = svg.querySelector('.cs-overlay'), hl = svg.querySelector('.cs-hover'), dot = svg.querySelector('.cs-dot');
    ov.addEventListener('mousemove', e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = pts[0]; for (const q of pts) if (Math.abs(q.x - p.x) < Math.abs(best.x - p.x)) best = q;
      hl.setAttribute('x1', best.x); hl.setAttribute('x2', best.x); hl.style.opacity = 1;
      dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y); dot.style.opacity = 1; dot.classList.toggle('bad', best.v > 8);
      tip.innerHTML = `<b>${t1(best.v)} °C</b><span>${fmtDT(best.t)}</span>`;
      tip.style.left = `${e.clientX + 16}px`; tip.style.top = `${e.clientY - 20}px`; tip.style.opacity = 1; tip.classList.toggle('bad', best.v > 8);
    });
    ov.addEventListener('mouseleave', () => { hl.style.opacity = 0; dot.style.opacity = 0; tip.style.opacity = 0; });
  });
}

    <div>${fmtD(l.excursion.from)}, de ${hhmm(l.excursion.from)} a ${hhmm(l.excursion.to)}. El rango permitido es de 2 a 8 °C y el lote ya se entregó en ${plural(l.deliveries.length, 'comercio', 'comercios')}.</div></div></div>` : ''}
  ${blocked ? `<div class="callout bad ${just}"><span class="c-ic">${icon('lock', 20)}</span><div><b>Lote bloqueado y en retiro</b>
    <div>Se avisó a Calidad y a los ${plural(l.deliveries.length, 'comercio', 'comercios')} afectados. Nadie puede vender ni despachar este lote.</div></div></div>` : ''}
  <div class="card mt"><div class="card-h"><h2>Recorrido del lote</h2></div>${lotSteps(l)}</div>

  <div class="grid g2 mt">

      <dt>Vencimiento</dt><dd style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${fmtD(l.expires)} ${semaforo(d)}</dd>
      <dt>Conservación</dt><dd>Entre 2 y 8 °C</dd>
      <dt>Temperatura</dt><dd>${temps.length ? `Mín. ${t1(Math.min(...temps))} °C · Máx. <span style="color:${l.excursion ? 'var(--bad)' : 'inherit'}">${t1(Math.max(...temps))} °C</span>` : 'Sin lecturas'}</dd>
    </dl></div></div>
    <div class="card"><div class="card-h"><h2>Dónde está el lote</h2><span class="muted" style="font-size:.88rem">${l.deliveries.length ? plural(l.deliveries.length, 'comercio', 'comercios') : ''}</span></div><div class="card-b">
      ${l.deliveries.length ? `<div class="stores">${l.deliveries.map((dv, i) => { const st = STORES[dv.store]; return `<div class="store"><span class="store-n">${i + 1}</span>
        <div class="store-main"><div class="store-name">${st.name}</div><div class="store-sub">${st.barrio}, ${st.depto} · entregado ${fmtD(dv.at)} ${hhmm(dv.at)}</div></div>
        <span class="tnum muted">${num(dv.units)} u.</span>${blocked ? `<span class="badge b-bloqueado">Retiro pendiente</span>` : `<span class="badge b-ok">Entregado</span>`}</div>`; }).join('')}</div>`
        : `<div class="muted">${l.loc === 'transito' ? `En ${TRUCKS[l.truck].name}, ${TRUCKS[l.truck].route}. Todavía no se entregó a comercios.` : `En ${PLANT}, ${l.place}. Todavía no salió de planta.`}</div>`}
    </div></div>
  </div>`;
}
function bindLote(id) {
  bindCharts();
  const b = document.getElementById('block-btn'); if (b) b.onclick = () => openBlockModal(id);
}

/* ===================== Bloqueo, mail y registro ===================== */
function emailParams(l) {
  return {
    to_email: DEMO_RECIPIENTS,
    lote: l.id,
    producto: l.product,
    incidente: `${t1(l.excursion.max)} °C durante ${l.excursion.minutes} min en ${TRUCKS[l.truck].name}`,
    comercios: l.deliveries.map(d => `• ${STORES[d.store].name} (${STORES[d.store].barrio}) – ${num(d.units)} unidades`).join('\n'),
    accion: 'Bloqueo y retiro inmediato',
    fecha_hora: fmtFull(new Date()),
  };
}
// Mismo texto que la plantilla sugerida de EmailJS (ver GUIA-DEMO.md)
function renderEmail(p) {
  return {
    subject: `Retiro inmediato – Lote ${p.lote} (${p.producto})`,
    body: `Atención: se bloqueó el lote ${p.lote} – ${p.producto}.

Incidente: ${p.incidente}
Acción: ${p.accion}
Fecha y hora: ${p.fecha_hora}

Comercios afectados:
${p.comercios}

Qué hacer ahora:
1. Retirar de góndola todas las unidades del lote ${p.lote}.
2. Separarlas en cámara, identificadas como "NO VENDER".
3. Esperar la recolección de Logística (dentro de las próximas 24 horas).

Calidad · Loti`,
  };
}
function emailConfigured() {
  return Object.values(EMAILJS_CONFIG).every(v => v && !v.startsWith('TU_')) && DEMO_RECIPIENTS && !/[\[\]]|\.\.\./.test(DEMO_RECIPIENTS);
}
async function sendRecallEmail(params) {
  if (!emailConfigured()) { console.warn('[Loti] EmailJS no está configurado: no se envió el mail real (la demo sigue igual).'); return; }
  if (!window.emailjs) { console.warn('[Loti] El SDK de EmailJS no cargó (¿sin conexión?). La demo sigue igual.'); return; }
  try {
    emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error(`El envío tardó más de ${EMAIL_TIMEOUT_MS / 1000} s`)), EMAIL_TIMEOUT_MS));
    const res = await Promise.race([emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params), timeout]);
    console.info('[Loti] Mail enviado por EmailJS:', res);
  } catch (err) {
    console.error('[Loti] Falló el envío del mail (la demo sigue igual):', err);
  }
}
function openBlockModal(id) {
  const l = getLot(id);
  const n = l.deliveries.length + 1;
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><span class="m-ic">${icon('lock', 22)}</span><div><h2 style="font-size:1.35rem">¿Bloquear y retirar el lote ${l.id}?</h2><div class="sub">${l.product} · ${num(l.units)} unidades</div></div></div>
    <div class="modal-b">Al confirmar:
      <ul><li>El lote queda <b>bloqueado</b> en todas las vistas: nadie lo puede vender ni despachar.</li>
      <li>Se avisa por mail a <b>Calidad y a ${plural(l.deliveries.length, 'comercio', 'comercios')}</b> (${n} destinatarios).</li>
      <li>Los comercios ven un <b>aviso de retiro inmediato</b> en su pantalla.</li></ul></div>
    <div class="modal-f"><button class="btn" id="m-cancel">Cancelar</button><button class="btn btn-danger" id="m-ok">${icon('lock', 18)}Sí, bloquear y retirar</button></div>
  </div></div>`;
  const close = () => root.innerHTML = '';
  document.getElementById('m-cancel').onclick = close;
  document.getElementById('ov').onclick = e => { if (e.target.id === 'ov') close(); };
  document.getElementById('m-ok').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true; document.getElementById('m-cancel').disabled = true;
    btn.innerHTML = `<span class="spin"></span>Notificando…`;
    const params = emailParams(l);
    await Promise.all([sendRecallEmail(params), wait(900)]);
    applyBlock(l, params);
    close();
    render();
    toast(`Notificación enviada a ${n} destinatarios`);
    mascotFlex();
  };
}
function applyBlock(l, params) {
  l.status = 'bloqueado'; l.blockedAt = new Date();
  S.alerts.forEach(a => { if (a.lot === l.id && a.level === 'critica') { a.state = 'en_retiro'; a.text = `${a.text.split('.')[0]}. Lote bloqueado y retiro en curso en ${plural(l.deliveries.length, 'comercio', 'comercios')}.`; } });
  const mail = renderEmail(params);
  S.notifications.unshift({
    lot: l.id, at: new Date(), subject: mail.subject, body: mail.body, realTo: params.to_email,
    to: [QUALITY, ...l.deliveries.map(d => ({ name: STORES[d.store].name, email: STORES[d.store].email }))],
  });
  S.justBlocked = l.id;
  setTimeout(() => { S.justBlocked = null; }, 1500);
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<span class="t-ic">${icon('check', 18, 3)}</span>${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(() => el.remove(), 400); }, 4200);
}
function openLog() {
  const root = document.getElementById('drawer-root');
  const list = S.notifications.length ? S.notifications.map(n => `<div class="mail">
      <div class="mail-h"><div class="mail-subj">${esc(n.subject)}</div>
        <div><b>Enviado</b>${fmtDT(n.at)}</div>
        <div><b>Para</b>${n.to.length} destinatarios<div class="rcpt">${n.to.map(r => `<span title="${esc(r.email)}">${esc(r.name)}</span>`).join('')}</div></div>
        ${emailConfigured() ? `<div style="margin-top:6px"><b>Mail real</b>${esc(n.realTo)}</div>` : ''}</div>
      <div class="mail-body">${esc(n.body)}</div></div>`).join('')
    : `<div class="empty">${icon('mail', 34, 1.6)}<div style="margin-top:8px">Todavía no se envió ninguna notificación.</div></div>`;
  root.innerHTML = `<div class="drawer-ov" id="dov"></div><aside class="drawer" role="dialog" aria-label="Registro de notificaciones">
    <div class="drawer-h"><div><h2 style="font-size:1.3rem">Registro de notificaciones</h2><div class="sub">Mails enviados desde Loti</div></div><button class="icon-btn" id="dclose" aria-label="Cerrar">${icon('x', 20)}</button></div>
    <div class="drawer-b">${list}</div></aside>`;
  const close = () => root.innerHTML = '';
  document.getElementById('dov').onclick = close; document.getElementById('dclose').onclick = close;
}

/* ===================== Vencimientos ===================== */
function viewVencimientos() {
  const tabs = [['todos', 'Todos'], ['planta', 'En planta'], ['comercios', 'En comercios']];
  const rows = S.lots.filter(l => l.loc !== 'transito')
    .filter(l => S.vencTab === 'todos' || l.loc === S.vencTab)
    .sort((a, b) => daysLeft(a) - daysLeft(b));
  const count = c => S.lots.filter(l => l.loc !== 'transito' && semClass(daysLeft(l)) === c).length;
  return `
  <div class="page-head"><div><h1>Vencimientos</h1><div class="sub">Lotes ordenados por días hasta vencer, en planta y en comercios</div></div>
    <div class="legend" style="font-size:.95rem"><span><span class="dot bad"></span>Menos de 3 días (${count('bad')})</span><span><span class="dot warn"></span>3 a 7 días (${count('warn')})</span><span><span class="dot ok"></span>Más de 7 días (${count('ok')})</span></div></div>
  <div class="card"><div class="card-b" style="padding-bottom:8px"><div class="chips">${tabs.map(([k, v]) => `<button class="chip ${S.vencTab === k ? 'on' : ''}" data-tab="${k}">${v}</button>`).join('')}</div></div>
    <div class="table-scroll"><table><thead><tr><th>Semáforo</th><th>Lote</th><th>Producto</th><th>Dónde está</th><th>Vence</th><th>Unidades</th><th>Estado</th></tr></thead><tbody>
    ${rows.map(l => { const d = daysLeft(l); return `<tr class="click ${l.status === 'bloqueado' ? 'row-blocked' : ''}" data-lot="${l.id}">
      <td>${semaforo(d)}</td><td class="lot-id">${l.id}</td><td>${l.product}</td>
      <td class="muted">${l.loc === 'planta' ? `${PLANT} · ${l.place}` : l.deliveries.map(x => STORES[x.store].name).join(', ')}</td>
      <td class="tnum">${fmtD(l.expires)}</td><td class="tnum">${num(l.units)}</td><td>${statusBadge(l)}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}
function bindVencimientos() {
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.vencTab = b.dataset.tab; render(); });
  bindRows();
}

/* ===================== Logística ===================== */
function viewLogistica() {
  const hero = getLot('L-2411');
  const cards = Object.entries(TRUCKS).map(([tid, T]) => {
    const onboard = S.lots.filter(l => l.truck === tid && l.loc === 'transito');
    const delivered = S.lots.filter(l => l.truck === tid && l.loc === 'comercios');
    const recall = S.lots.filter(l => l.truck === tid && l.status === 'bloqueado');
    const exc = S.lots.filter(l => l.truck === tid && l.excursion);
    const live = onboard[0] ? onboard[0].temps[onboard[0].temps.length - 1] : null;
    const temp = live ? live.v : 4.0;
    const enRuta = onboard.length > 0;
    return `<div class="card truck ${exc.length && !recall.length ? '' : ''}">
      <div class="truck-h"><div><h2 style="font-size:1.3rem;display:flex;align-items:center;gap:8px">${icon('truck', 22)}${T.name}</h2><div class="sub">${T.route} · ${T.plate}</div></div>
        ${enRuta ? `<span class="badge b-transito">En ruta</span>` : `<span class="badge b-muted">En base</span>`}</div>
      <div class="truck-temp" style="color:var(--ok)">${t1(temp)} °C<small>${enRuta ? 'ahora' : 'en base'}</small></div>
      <div style="margin-bottom:8px"><span class="badge b-ok">${icon('check', 13, 2.6)}Dentro de 2–8 °C</span></div>
      <div class="row"><span>Chofer</span><span>${T.driver}</span></div>
      <div class="row"><span>Entregas</span><span>${T.stops}</span></div>
      <div class="row"><span>${enRuta ? 'Lotes a bordo' : 'Última ruta'}</span><span>${(enRuta ? onboard : delivered).map(l => `<a href="#/lote/${l.id}">${l.id}</a>`).join(', ')}</span></div>
      ${exc.map(l => recall.includes(l)
        ? `<div class="task bad"><b>Retiro en curso: ${l.id}</b><br>Pasar a recolectar por ${plural(l.deliveries.length, 'comercio', 'comercios')}: ${l.deliveries.map(d => STORES[d.store].name).join(', ')}.</div>`
        : `<div class="task bad"><b>Desvío de temperatura ${fmtD(l.excursion.from)}</b><br>${t1(l.excursion.max)} °C durante ${l.excursion.minutes} min, de ${hhmm(l.excursion.from)} a ${hhmm(l.excursion.to)} · <a href="#/lote/${l.id}" style="color:inherit;font-weight:700;text-decoration:underline">${l.id}</a></div>`).join('')}
    </div>`;
  }).join('');
  return `<div class="page-head"><div><h1>Logística</h1><div class="sub">Camiones, rutas y temperatura en tránsito</div></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${cards}</div>
    <div class="card mt"><div class="card-h"><h2>Temperatura del ${TRUCKS.T3.name} en su última ruta</h2><span class="muted" style="font-size:.88rem">Lote ${hero.id}</span></div><div class="card-b">${tempChart(hero)}</div></div>`;
}

/* ===================== Vista Comercio ===================== */
function viewComercio() {
  const st = STORES[S.storeId];
  const mine = S.lots.filter(l => l.deliveries.some(d => d.store === S.storeId))
    .map(l => ({ l, dv: l.deliveries.find(d => d.store === S.storeId) }))
    .sort((a, b) => (b.l.status === 'bloqueado') - (a.l.status === 'bloqueado') || daysLeft(a.l) - daysLeft(b.l));
  const recalls = mine.filter(x => x.l.status === 'bloqueado');
  const soon = mine.filter(x => daysLeft(x.l) <= 7 && x.l.status !== 'bloqueado');
  return `
  <div class="page-head"><div><h1>${st.name}</h1><div class="sub">${st.barrio}, ${st.depto} · lotes recibidos de ${PLANT}</div></div>
    <label class="store-pick"><span class="muted">Comercio</span><select id="store-sel">${Object.entries(STORES).map(([k, v]) => `<option value="${k}" ${k === S.storeId ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label></div>
  ${recalls.map(({ l, dv }) => `<div class="banner"><span class="b-ic">${icon('alert', 24)}</span><div>
    <h2>Aviso de retiro · Lote ${l.id} · ${l.product}</h2>
    <p>Retirá ya de góndola las <b>${num(dv.units)} unidades</b> que recibiste el ${fmtD(dv.at)} y separalas en cámara como <b>“NO VENDER”</b>.</p>
    <p>Motivo: se rompió la cadena de frío durante el transporte (${t1(l.excursion.max)} °C durante ${l.excursion.minutes} min). Logística pasa a recolectarlas en las próximas 24 horas.</p></div></div>`).join('')}
  <div class="grid g4" style="grid-template-columns:repeat(3,1fr)">
    ${kpi('box', '', 'Lotes recibidos', mine.length, 'Últimos 30 días')}
    ${kpi('calendar', soon.length ? 'warn' : 'ok', 'Vencen en 7 días', soon.length, soon.length ? 'Revisá la góndola' : 'Nada por vencer')}
    ${kpi('alert', recalls.length ? 'bad' : 'ok', 'Avisos de retiro', recalls.length, recalls.length ? '<b style="color:var(--bad)">Acción inmediata</b>' : 'Sin avisos')}
  </div>
  <div class="card mt"><div class="card-h"><h2>Lotes recibidos</h2></div>
    <div class="table-scroll"><table><thead><tr><th>Lote</th><th>Producto</th><th>Recibido</th><th>Unidades</th><th>Vence</th><th>Semáforo</th><th>Estado</th></tr></thead><tbody>
    ${mine.length ? mine.map(({ l, dv }) => `<tr class="${l.status === 'bloqueado' ? 'row-blocked' : ''}"><td class="lot-id">${l.id}</td><td>${l.product}</td><td class="tnum">${fmtD(dv.at)} · ${hhmm(dv.at)}</td><td class="tnum">${num(dv.units)}</td><td class="tnum">${fmtD(l.expires)}</td><td>${semaforo(daysLeft(l))}</td>
      <td>${l.status === 'bloqueado' ? `<span class="badge b-bloqueado">${icon('lock', 14, 2.4)}Bloqueado – En retiro</span>` : `<span class="badge b-ok">Apto para venta</span>`}</td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">Este comercio no recibió lotes en los últimos 30 días.</td></tr>`}
    </tbody></table></div></div>`;
}
function bindComercio() { document.getElementById('store-sel').onchange = e => { S.storeId = e.target.value; render(); }; }

/* ===================== Render ===================== */
function render() {
  const r = route(); const p = PROFILES[S.profile];
  const allowed = r.name === 'lote' ? S.profile !== 'comercio' : p.nav.includes(r.name);
  if (!allowed) { if (location.hash !== p.home) { location.hash = p.home; return; } }
  renderTopbar();
  const app = document.getElementById('app');
  document.getElementById('chart-tip').style.opacity = 0;
  if (r.name === 'lote') { app.innerHTML = viewLote(r.arg); bindLote(r.arg); }
  else if (r.name === 'vencimientos') { app.innerHTML = viewVencimientos(); bindVencimientos(); }
  else if (r.name === 'logistica') { app.innerHTML = viewLogistica(); bindCharts(); }
  else if (r.name === 'comercio') { app.innerHTML = viewComercio(); bindComercio(); }
  else { app.innerHTML = viewTablero(); bindTablero(); }
}
let lastRoute = location.hash;
window.addEventListener('hashchange', () => { if (location.hash !== lastRoute) { lastRoute = location.hash; window.scrollTo(0, 0); } render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const ov = document.getElementById('m-cancel'); if (ov && !ov.disabled) ov.click(); document.getElementById('drawer-root').innerHTML = ''; } });

const resetBtn = document.getElementById('reset-btn');
resetBtn.innerHTML = `${icon('refresh', 14)}Reiniciar demo`;
resetBtn.onclick = () => {
  S = initialState();
  document.getElementById('modal-root').innerHTML = ''; document.getElementById('drawer-root').innerHTML = '';
  if (location.hash !== '#/tablero') location.hash = '#/tablero'; else render();
  toast('Demo reiniciada');
};

/* ===================== Mascota ===================== */
// Queda en la esquina, mira hacia el cursor y cada 6–10 s flexiona los bíceps
const mascotEl = document.getElementById('mascot');
function mascotFlex() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  mascotEl.classList.remove('flex'); void mascotEl.offsetWidth; mascotEl.classList.add('flex');
  setTimeout(() => mascotEl.classList.remove('flex'), 1350);
}
(function startMascot() {
  const svg = mascotEl.querySelector('svg');
  const pupils = [...mascotEl.querySelectorAll('.pupil')];
  const EYE_TRAVEL = 5; // unidades del dibujo que se puede mover la pupila
  addEventListener('mousemove', e => {
    const ctm = svg.getScreenCTM(); if (!ctm) return;
    pupils.forEach(p => {
      const c = new DOMPoint(+p.getAttribute('cx'), +p.getAttribute('cy')).matrixTransform(ctm);
      const dx = e.clientX - c.x, dy = e.clientY - c.y;
      const dist = Math.hypot(dx, dy) || 1;
      const k = Math.min(1, dist / 120) * EYE_TRAVEL / dist;
      p.style.transform = `translate(${dx * k}px, ${dy * k * 0.8}px)`;
    });
  });
  (function flexLoop() { setTimeout(() => { mascotFlex(); flexLoop(); }, 6000 + Math.random() * 4000); })();
})();

render();
</script>
